services:
  nginx:
    build: requirements/nginx
    container_name: nginx
    ports:
    - "443:443"
    - "80:80"
    networks:
      - inception
    restart: always
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    networks:
      - inception
    restart: always
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    networks:
      - inception
    depends_on:
      - nginx
    restart: always

networks:
  inception:
    driver: bridge

