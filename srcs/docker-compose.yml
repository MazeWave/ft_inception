services:
  nginx:
    build: requirements/nginx
    container_name: nginx
    ports:
    - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
    restart: always
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    networks:
      - inception
    restart: always
    env_file: .env
    expose:
      - 3306
    # volumes:
    #   - mariadb:/var/lib/mysql
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
    env_file: .env
    expose:
      - 9000
    # volumes:
    #   - wordpress:/var/www/html

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
    driver: local # ici nous stockons le volume en local
    driver_opts:
      type: 'none' 									# aucun type spécifique
      o: 'bind'
      device: '/home/ldalmass/data/wordpress' 		#Ou stocker le dossier sur votre ordinateur en local
  mariadb:
    driver: local
    driver_opts:
      type: 'none' 
      o: 'bind'										 # Les Bind Mounts sont des volumes qui se montent sur un chemin d'accès à l'hôte, et ils peuvent être modifiés par d'autres processus en dehors de docker.
      device: '/home/ldalmass/data/mariadb'			#Ou stocker le dossier sur votre ordinateur en local